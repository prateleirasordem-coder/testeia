[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testeia"
version = "0.1.0"
description = "Núcleo extensível para um plugin de IA"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
testeia = "testeia.__main__:main"

[tool.setuptools.packages.find]
include = ["testeia*"]
